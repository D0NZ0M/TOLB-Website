<title>Starting Soon · tolb_d0nz0m</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Cinzel:wght@500;700&family=Rajdhani:wght@600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#05020c;--p:#a855f7;--p2:#7c3aed;--pl:#d8b4fe;--ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(ellipse at 70% 40%,#1b0a35 0%,#0a0418 55%,#05020c 100%);overflow:hidden;font-family:'Cinzel',serif;color:var(--ink)}
.smoke{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;animation:drift 18s ease-in-out infinite alternate}
.s1{width:900px;height:700px;background:#5b21b6;left:-200px;top:300px}
.s2{width:800px;height:800px;background:#7c3aed;right:-100px;top:-200px;animation-duration:24s;opacity:.4}
.s3{width:700px;height:500px;background:#3b0f78;left:500px;bottom:-250px;animation-duration:21s}
@keyframes drift{to{transform:translate(120px,-70px) scale(1.2)}}
#fx{position:absolute;inset:0;z-index:2}
.wm{position:absolute;right:150px;top:140px;width:700px;opacity:.09;z-index:1;filter:drop-shadow(0 0 30px #a855f7)}
.zay{position:absolute;right:60px;bottom:-10px;height:960px;z-index:3;filter:drop-shadow(0 0 40px rgba(168,85,247,.75));animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.frame{position:absolute;inset:26px;border:3px solid var(--p);border-radius:6px;z-index:9;pointer-events:none;box-shadow:0 0 22px var(--p),inset 0 0 40px rgba(168,85,247,.35)}
.frame:before,.frame:after{content:"";position:absolute;width:120px;height:120px;border:8px solid var(--pl)}
.frame:before{left:-6px;top:-6px;border-right:0;border-bottom:0}
.frame:after{right:-6px;bottom:-6px;border-left:0;border-top:0}
.name{position:absolute;left:90px;top:70px;width:760px;z-index:6;filter:drop-shadow(0 0 18px rgba(168,85,247,.6))}
.mid{position:absolute;left:90px;top:360px;width:1050px;z-index:6}
h1{font-family:'Permanent Marker',cursive;font-weight:400;font-size:178px;line-height:.95;transform:skewX(-7deg);text-shadow:0 0 14px var(--p),0 0 46px var(--p2),6px 6px 0 #2a0a52;letter-spacing:2px}
h1 span{display:block;color:var(--pl)}
.sub{margin:22px 0 0 8px;font-size:36px;font-style:italic;letter-spacing:6px;color:#cdb4f5;opacity:.9}
.cd{margin:36px 0 0 6px;display:flex;align-items:center;gap:26px}
.time{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:150px;line-height:1;letter-spacing:8px;padding:6px 40px;border:3px solid var(--p);background:rgba(10,4,24,.7);box-shadow:0 0 26px rgba(168,85,247,.6),inset 0 0 26px rgba(168,85,247,.3);text-shadow:0 0 18px var(--p);clip-path:polygon(24px 0,100% 0,calc(100% - 24px) 100%,0 100%)}
.lbl{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:34px;letter-spacing:7px;color:var(--pl);line-height:1.25}
.live .time{animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 60px var(--p),inset 0 0 40px var(--p);transform:scale(1.03)}}
.bar{position:absolute;left:26px;right:26px;bottom:26px;height:104px;z-index:8;background:linear-gradient(90deg,rgba(5,2,12,.92),rgba(30,10,60,.85));border-top:3px solid var(--p);box-shadow:0 -6px 30px rgba(168,85,247,.35);display:flex;align-items:center;padding:0 60px;gap:28px;font-family:'Rajdhani',sans-serif;font-weight:700}
.bar svg{width:56px;height:56px;fill:var(--p);filter:drop-shadow(0 0 10px var(--p))}
.url{font-size:50px;letter-spacing:2px}
.url b{color:var(--pl);font-weight:700}
.tip{margin-left:auto;font-size:34px;letter-spacing:4px;color:var(--pl);text-transform:uppercase;transition:opacity .6s}
.em{position:absolute;z-index:4;bottom:-160px;opacity:.9;filter:drop-shadow(0 0 12px rgba(168,85,247,.8));animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-1300px) rotate(var(--r))}}
</style></head>

const st=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='scale('+s+') translate(-50%,-50%)';st.style.transformOrigin='0 0';st.style.left='50%';st.style.top='50%'}
addEventListener('resize',fit);fit();
// countdown: add #10 to the page link for a 10 minute timer (default 5)
let m=parseInt(location.hash.slice(1),10);if(!(m>0&&m<=180))m=5;
const end=Date.now()+m*60000,t=document.getElementById('t'),sub=document.getElementById('sub'),pad=n=>String(n).padStart(2,'0');
function tick(){const l=Math.max(0,Math.round((end-Date.now())/1000));
 t.textContent=l>=3600?Math.floor(l/3600)+':'+pad(Math.floor(l%3600/60))+':'+pad(l%60):pad(Math.floor(l/60))+':'+pad(l%60);
 if(!l){document.body.classList.add('live');sub.textContent='Going live…'}}
setInterval(tick,250);tick();
// rotating lines
const tips=['Grab a drink · Get comfy','Say hi in chat','Follow so you never miss a stream','Zombies incoming…','Good vibes · Great community'];
let ti=0;const tip=document.getElementById('tip');
setInterval(()=>{tip.style.opacity=0;setTimeout(()=>{ti=(ti+1)%tips.length;tip.textContent=tips[ti];tip.style.opacity=1},600)},5000);
// rising emotes
function spawn(){const i=document.createElement('img');i.src=EM[Math.floor(Math.random()*EM.length)];i.className='em';
 const s=90+Math.random()*60;i.style.cssText+=`width:${s}px;left:${60+Math.random()*1700}px;--dx:${(Math.random()-.5)*300}px;--r:${(Math.random()-.5)*50}deg;animation-duration:${12+Math.random()*8}s`;
 st.appendChild(i);setTimeout(()=>i.remove(),21000)}
setInterval(spawn,1800);for(let k=0;k<5;k++)setTimeout(spawn,k*300);
// embers
const c=document.getElementById('fx'),x=c.getContext('2d'),P=[];
for(let k=0;k<90;k++)P.push({x:Math.random()*1920,y:Math.random()*1080,r:1+Math.random()*3,v:.3+Math.random()*1.1,w:Math.random()*6});
(function loop(){x.clearRect(0,0,1920,1080);for(const p of P){p.y-=p.v;p.w+=.02;p.x+=Math.sin(p.w)*.6;if(p.y<-10){p.y=1090;p.x=Math.random()*1920}
 x.beginPath();x.fillStyle='rgba(192,132,252,'+(.25+.5*Math.abs(Math.sin(p.w)))+')';x.shadowColor='#a855f7';x.shadowBlur=12;x.arc(p.x,p.y,p.r,0,6.3);x.fill()}requestAnimationFrame(loop)})();
